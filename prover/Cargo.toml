[package]
name = "nyks-prover"
description = "backbone of everything zk"
authors = ["Nyksdevs"]
version = "0.8.0"
edition = "2024"

license = "Apache-2.0"

repository = "https://github.com/Nyksnet/nyksnode/"

[dependencies]
nyks-consensus = { version = "0.8.0", path = "../consensus" }
tokio = { version = "1.45.1", features = ["full", "tracing"] }
tracing = "0.1.41"
serde_json = "1.0.148"
thread-priority = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0.65"
fd-lock = "4.0.4"

mimalloc = { version = "0.1.52", optional = true }

[dev-dependencies]

[features]
default = []
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true
